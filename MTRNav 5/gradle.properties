# Verify these against https://fabricmc.net/develop for MC 1.18.2 before your first build.
# Loom itself is version-agnostic (it can target any Minecraft version), so the loom
# plugin version in build.gradle does not need to match minecraft_version below.
org.gradle.jvmargs=-Xmx3G

minecraft_version=1.18.2
yarn_mappings=1.18.2+build.4
loader_version=0.14.21
fabric_version=0.77.0+1.18.2

# MTR itself, and the version of its own compile-time libraries. MTRNav only needs
# MTR on the classpath (modImplementation below) -- it does NOT need the
# Minecraft-Mappings / Transport-Simulation-Core jars that MTR uses internally,
# because MTRNav talks to MTR only through its public org.mtr.core.data.* classes
# and normal vanilla Fabric APIs. See README.md, section "Why no MTR core libs".
mtr_version=4.0.5+1.18.2

mod_version=1.0.0
maven_group=com.mtrnav
archives_base_name=mtrnav
