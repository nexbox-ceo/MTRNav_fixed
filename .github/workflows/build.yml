name: Build MTRNav

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build MTRNav
        working-directory: MTRNav 5
        run: gradle build --no-daemon

      - name: Upload MTRNav JAR
        uses: actions/upload-artifact@v4
        with:
          name: mtrnav-jar
          path: |
            MTRNav 5/build/libs/*.jar
          if-no-files-found: error
